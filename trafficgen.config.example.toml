# TrafficGenerator runtime config example.
# Copy to trafficgen.config.toml for local runs, then edit environment-specific
# values such as repo paths, Prometheus URL, and Nimbus host IP.

[trace]
file = "datatrace/day_night.csv"
# start_minute = 0
# end_minute = 1439

[cluster]
namespace = "serverless"

[traffic]
# Scale is global for every service in [[services]].
scale = 0.3
dry_run = false
# random_seed = 12345

[system.repos]
kscb = "../kube-startup-cpu-boost"
knative = "../knative-serving"
nimbus = "../nimbus"

[system.kscb]
namespace = "kube-startup-cpu-boost-system"

[system.knative]
namespace = "knative-serving"
decide_url = "http://nimbus.knative-serving.svc.cluster.local:8080/decide"

[system.nimbus]
host_node = "master"
host_ip = "<nimbus_host_ip>"
service_namespace = "knative-serving"

[[services]]
service_base = "measure-yolo"
trace_apps = ["yolo_x_cpu"]
path = "/detect/local"
url_template = "http://{service}.{namespace}.svc.cluster.local{path}"
ksvc_template = "generateKsvc/templates/measure-yolo.yaml"

# auto = calculator uses max scaled RPS x assumed busy time.
# Set an integer, for example 4, to intentionally cap clone count.
alias_count = "auto"

# Per-service CPU profile. These example values come from the current Nimbus
# preload for measure-yolo; use different values for other services.
cpu.cpu_budget_static = "1000m"
cpu.c_opt_cold = "875m"
cpu.c_opt_warm = "437m"
cpu.c_min_cold = "500m"
cpu.c_min_warm = "300m"

nimbus.node_pool_selector = "nimbus.io/pool=serverless"
nimbus.pre_measured_dir = "../nimbus/results/backup-tuned"

# Example only: uncomment when a second trace app/service is ready.
# [[services]]
# service_base = "measure-web"
# trace_apps = ["web_cpu"]
# path = "/"
# url_template = "http://{service}.{namespace}.svc.cluster.local{path}"
# ksvc_template = "generateKsvc/templates/measure-web.yaml"
# alias_count = "auto"
# cpu.cpu_budget_static = "<measure_web_cpu_budget_static>"
# cpu.c_opt_cold = "<measure_web_c_opt_cold>"
# cpu.c_opt_warm = "<measure_web_c_opt_warm>"
# cpu.c_min_cold = "<measure_web_c_min_cold>"
# cpu.c_min_warm = "<measure_web_c_min_warm>"
# nimbus.node_pool_selector = "<measure_web_node_pool_selector>"
# nimbus.pre_measured_dir = "<measure_web_pre_measured_dir>"

[routing]
increase_service = true
suffix_template = "{service_base}-{index:03d}"
request_timeout_sec = 300

# Clone-count planning only. Defaults to request_timeout_sec if omitted, which
# is conservative and can overestimate aliases.
dry_run_assumed_service_time_sec = 30
# max_aliases = 4

[ksvc_aliases]
# The runner inherits template/base/namespace from [[services]] and [cluster].
enabled = true
output_dir = "generated-ksvc"
pull_images = false
# nodes = "generateKsvc/nodes.json"
create_namespace = true
apply = true

[request]
method = "POST"
# headers_file = "payloads/headers.json"
request_id_header = "X-Trafficgen-Request-Id"
include_request_id_in_body = true
request_id_body_field = "request_id"
content_type = "application/json"
# body = '{"image":"local"}'
# body_file = "payloads/body.json"
# body_template_file = "payloads/body.template.json"

[logging]
dir = "logs"
log_response_body = true
max_body_log_bytes = 65536

[metrics]
results_dir = "results"
output_dir = "results/metrics"
plots_dir = "results/plots"
step_sec = 60
warm_slo_ms = 1500
cold_slo_ms = 15000
request_timeout_sec = 300

[metrics.configuration_labels]
static-knative = "Static Knative"
fixed-boost = "Fixed Startup Boost"
full-nimbus = "Full Nimbus"

[metrics.prometheus]
url = "http://localhost:9090"
namespace = "serverless"
service_base = "measure-yolo"
service_regex = "measure-yolo.*"

[metrics.prometheus.queries]
ready_pods = 'sum(kube_pod_status_ready{namespace="$namespace",condition="true",pod=~"$service_regex"})'
pending_pods = 'sum(kube_pod_status_phase{namespace="$namespace",phase="Pending",pod=~"$service_regex"})'
allocated_cpu_cores = 'sum(kube_pod_container_resource_requests{namespace="$namespace",resource="cpu",pod=~"$service_regex"})'
actual_cpu_cores = 'sum(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod=~"$service_regex",container!="",container!="POD"}[1m]))'

# Optional. Leave blank until Nimbus exports stable mode/tier metrics.
nimbus_mode = ""
nimbus_tier = ""
