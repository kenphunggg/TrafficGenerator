# TrafficGenerator runtime config example.
# Copy to trafficgen.config.toml for local runs, then edit the values below.
# The generated implementation should load this TOML file first, then apply
# optional .env or process-environment overrides for automation.

[trace]
# CSV trace to replay. Known traces live in datatrace/.
file = "datatrace/day_night.csv"

# Leave unset to replay the whole trace.
# start_minute = 0
# end_minute = 1439

[traffic]
# Replay one trace minute as 60 real seconds; there is no speedup setting.
scale = 0.3

# Set true to print the schedule without sending HTTP requests.
dry_run = false

# Set for deterministic arrival offsets across repeated runs.
# random_seed = 12345

[target]
# Base Knative Service name. With suffix routing enabled, this becomes
# measure-yolo-001, measure-yolo-002, and so on.
service_base = "measure-yolo"

# Optional map from trace function_id/app_name to service base names.
# service_map_file = "service-map.json"

namespace = "serverless"
path = "/detect/local"

# URL template fields include service, service_base, namespace, path,
# function_id, minute, arrival_offset_sec, request_index, and request_id.
url_template = "http://{service}.{namespace}.svc.cluster.local{path}"

[routing]
# true avoids routing a new request to an alias that is still processing.
# This controls target service-name selection only. Matching cloned KServices
# must exist before replay starts; configure that under [ksvc_aliases].
increase_service = true
suffix_template = "{service_base}-{index:03d}"
request_timeout_sec = 300

# Set this to model warm alias reuse with an assumed response duration.
# If omitted, planning falls back to request_timeout_sec and becomes conservative.
# IMPORTANT: this is only for clone-count planning. Keep request_timeout_sec
# high enough for cold starts, but set this near expected p95 request lifetime
# so alias planning does not assume every request occupies a pod for 300s.
dry_run_assumed_service_time_sec = 30

# Runtime safety cap for suffix routing. The experiment runner sets this
# automatically from the computed alias count. Direct Locust runs can set it
# here or with MAX_KSVC_ALIASES to wait for in-range aliases instead of calling
# KServices that were not created.
# max_aliases = 4

[ksvc_aliases]
# Optional KService alias preparation for `python -m traffic_generator experiment run`.
# The experiment runner computes the clone count from the selected trace,
# traffic scale, and assumed request busy time.
enabled = true
template = "generateKsvc/templates/measure-yolo.yaml"
output_dir = "generated-ksvc"

# Defaults align with [target].service_base and [routing].suffix_template.
# base_name = "measure-yolo"
# suffix_template = "{base}-{index:03d}"
# namespace = "serverless"

# When enabled and apply=true, the runner checks whether all expected aliases
# already exist and skips generation/apply when they do.
pull_images = false
# nodes = "generateKsvc/nodes.json"
create_namespace = true
apply = true

[request]
# TrafficGenerator sends POST only.
method = "POST"

# Optional JSON file containing static request headers.
# headers_file = "payloads/headers.json"

request_id_header = "X-Trafficgen-Request-Id"
include_request_id_in_body = true
request_id_body_field = "request_id"
content_type = "application/json"

# Choose at most one body source. If none is set, the generator sends
# {"request_id": <id>} as the minimal JSON body.
# body = '{"image":"local"}'
# body_file = "payloads/body.json"
# body_template_file = "payloads/body.template.json"

[logging]
dir = "logs"
log_response_body = true
max_body_log_bytes = 65536

[metrics]
# Offline aggregation and plotting settings. Per-run experiment outputs are
# written into results/<configuration>/<run-id>/. These shared directories are
# used only when aggregating/plotting all discovered runs without --run-dir.
results_dir = "results"
output_dir = "results/metrics"
plots_dir = "results/plots"
step_sec = 60
warm_slo_ms = 1500
cold_slo_ms = 15000
request_timeout_sec = 300

[metrics.configuration_labels]
static-knative = "Static Knative"
fixed-boost = "Fixed Startup Boost"
full-nimbus = "Full Nimbus"

[metrics.prometheus]
url = "http://localhost:9090"
namespace = "serverless"
service_base = "measure-yolo"
service_regex = "measure-yolo.*"

[metrics.prometheus.queries]
ready_pods = 'sum(kube_pod_status_ready{namespace="$namespace",condition="true",pod=~"$service_regex"})'
pending_pods = 'sum(kube_pod_status_phase{namespace="$namespace",phase="Pending",pod=~"$service_regex"})'
allocated_cpu_cores = 'sum(kube_pod_container_resource_requests{namespace="$namespace",resource="cpu",pod=~"$service_regex"})'
actual_cpu_cores = 'sum(rate(container_cpu_usage_seconds_total{namespace="$namespace",pod=~"$service_regex",container!="",container!="POD"}[1m]))'

# Optional. Leave blank until Nimbus exports stable mode/tier metrics.
nimbus_mode = ""
nimbus_tier = ""
